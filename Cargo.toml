[package]
name = "gratttool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust reimplementation of BlueZ gatttool"

[[bin]]
name = "gratttool"
path = "src/main.rs"

[dependencies]
bluer = { version = "0.17", features = ["full"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rustyline-async = "0.4"
colored = "2"
hex = "0.4"
uuid = "1"
terminal_size = "0.4"
